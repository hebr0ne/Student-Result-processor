<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Processor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result Processor</h1>
        <p class="subtitle">Enter student marks and calculate the results.</p>

        <div class="form-box">

            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">

            <label>Student ID</label>
            <input type="text" id="studentId" placeholder="Enter student ID">

            <label>Mathematics</label>
            <input type="number" id="math" min="0" max="100">

            <label>Database</label>
            <input type="number" id="database" min="0" max="100">

            <label>Programming</label>
            <input type="number" id="programming" min="0" max="100">

            <label>Networking</label>
            <input type="number" id="networking" min="0" max="100">

            <button onclick="processResult()">Process Result</button>

        </div>

        <div id="result" class="result-box"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
